name: Windows CI
on:
  pull_request:
    # Draft PRs are skipped by the job condition below; ready_for_review starts the full run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      extended:
        description: Run existing bounded containment and uninstall-residue regressions
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 scaffold
    # A skipped draft run is not a passed check; use workflow_dispatch on the branch to check a draft head.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    # The AddressSanitizer builds and the lint and test suites run in the parallel windows-asan and windows-tests jobs
    # below, so each job keeps headroom (docs/ci.md#job-layout).
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      # Download caches live in the workspace so actions/cache saves paths that actually exist.
      # Electron's installer and @electron/get read electron_config_cache, not ELECTRON_CACHE.
      npm_config_cache: ${{ github.workspace }}\.local\cache\npm
      electron_config_cache: ${{ github.workspace }}\.local\cache\electron
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ETS2TELEMETRY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Acquire checksum-pinned CMake 4.3.1 x64
        run: ./scripts/ci/Install-CMake.ps1
      - name: Verify pinned npm and record host versions
        run: |
          if ((npm --version) -ne '11.17.0') { throw 'Expected npm 11.17.0 bundled with pinned Node.' }
          node scripts/ci/versions.mjs
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -format json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cache/npm
            .local/cache/electron
          key: download-${{ runner.os }}-x64-node24.19.0-abi137-electron44.7.0-abi149-${{ hashFiles('package-lock.json', 'tools/lint/package-lock.json') }}
      - name: Clean lockfile installation
        run: npm ci
      # Lint, PowerShell analysis, typecheck, the Node-safe suite and the storage suite run in the parallel windows-tests
      # job below (docs/ci.md#job-layout).
      - name: Build desktop and native x64
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # CTest resolves a relative --output-junit path against the build tree, so the JUnit paths are absolute.
          ctest --test-dir native/telemetry-client/build -C Release --output-on-failure --no-tests=error --output-junit "$PWD/.local/ci/ctest-client-release.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S native/telemetry-plugin -B native/telemetry-plugin/build -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run native:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run native:test -- --output-junit "$PWD/.local/ci/ctest-plugin-release.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Needs the Release test plugin DLL, fake-SDK host and native broker built above. Synthetic only.
      - name: CAP0 controlled capture chain
        timeout-minutes: 3
        run: |
          npm run test:cap0-chain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The same fake-SDK host, test plugin DLL and broker in its protocol v1 mode (ET-006b E14). Synthetic only.
      - name: Protocol v1 controlled broker chain
        timeout-minutes: 3
        run: |
          npm run test:v1-chain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Isolated synthetic v0 CLI pipe smoke
        run: npm run smoke --workspace @ets2telemetry/telemetry-simulator
      - name: Isolated synthetic v1 CLI pipe smoke
        run: npm run smoke:v1 --workspace @ets2telemetry/telemetry-simulator
      # Owner decision E2 (October 17, 2026, docs/ci.md#et-019t-speed-up-october-17-2026): pull requests run only the packaged
      # smokes; the development smokes run on main pushes and on every dispatch, whatever its `extended` input.
      - name: Bounded development Electron worker smoke
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode development
      - name: Bounded development telemetry source and recovery smoke
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode development -Scenario telemetry
      - name: Bounded development hidden overlay projection and isolation smoke
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode development -Scenario overlay -ForceRendererReuse
      - name: Bounded development tray lifecycle, single instance and explicit exit smoke
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode development -Scenario lifecycle
      # ET-015a PR-4: synthetic v1 recording through a killed service, close-to-tray, tray exit and restart.
      - name: Bounded development synthetic recording journey smoke
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode development -Scenario recording
      # ET-016 PR-4: the Journal tab on an empty history, then on a seeded synthetic database (never history).
      - name: Bounded development synthetic trip journal smoke
        if: github.event_name != 'pull_request'
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode development -Scenario journal
      # Owner decision E1 (October 17, 2026): pull requests package without the Squirrel maker. Nothing in a PR run reads
      # out/make; inspect:package and the packaged smokes read out/ETS2Telemetry Desktop-win32-x64, which both commands write.
      - name: Forge package and static native package inspection
        if: github.event_name == 'pull_request'
        run: |
          npm run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run inspect:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Forge maker and static native package inspection
        if: github.event_name != 'pull_request'
        run: |
          npm run make
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run inspect:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded Forge packaged Electron worker smoke
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode packaged
      - name: Bounded packaged telemetry source and recovery smoke
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode packaged -Scenario telemetry
      - name: Bounded packaged hidden overlay projection and isolation smoke
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode packaged -Scenario overlay -ForceRendererReuse
      - name: Bounded packaged tray lifecycle, single instance and explicit exit smoke
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode packaged -Scenario lifecycle
      - name: Bounded packaged synthetic recording journey smoke
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode packaged -Scenario recording
      - name: Bounded packaged synthetic trip journal smoke
        run: ./scripts/ci/Invoke-RuntimeSmoke.ps1 -Mode packaged -Scenario journal
      - name: Extended existing safety regressions
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.extended)
        run: ./scripts/ci/Invoke-Extended.ps1
      - name: Record final versions and duration
        if: always()
        run: node scripts/ci/versions.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ci
            .local/diagnostics/package-inspection.json
            native/telemetry-plugin/build/Testing/Temporary
            native/telemetry-client/build/Testing/Temporary
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
  windows-asan:
    name: Windows x64 native AddressSanitizer
    # Runs in parallel with the scaffold job on its own runner; same draft skip, triggers and concurrency group.
    # It needs only the checkout, pinned CMake, MSVC and Node for the version record; it builds its own
    # build-asan trees and uses no output of the scaffold job (docs/ci.md#job-layout).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      ETS2TELEMETRY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Acquire checksum-pinned CMake 4.3.1 x64
        run: ./scripts/ci/Install-CMake.ps1
      - name: Record host versions
        run: |
          node scripts/ci/versions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -format json
      - name: SDK-independent console AddressSanitizer checks
        run: |
          $sdkVsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $sdkVsPath) { throw 'MSVC installation not found for ASan runtime.' }
          $sdkVcVersion = (Get-Content -LiteralPath (Join-Path $sdkVsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $sdkAsanBin = Join-Path $sdkVsPath "VC\Tools\MSVC\$sdkVcVersion\bin\Hostx64\x64"
          if (-not (Test-Path -LiteralPath (Join-Path $sdkAsanBin 'clang_rt.asan_dynamic-x86_64.dll'))) { throw 'MSVC AddressSanitizer runtime not found.' }
          $env:PATH = "$sdkAsanBin;$env:PATH"
          Write-Output "ASan runtime: $sdkAsanBin"
          cmake -S native/telemetry-plugin -B native/telemetry-plugin/build-asan -G 'Visual Studio 17 2022' -A x64 -DETS2TELEMETRY_ASAN_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/telemetry-plugin/build-asan --config Release --target protocol-v0-asan-test protocol-v1-asan-test v1-producer-asan-test sdk-adapter-asan-test event-channel-asan-test snapshot-transport-asan-test snapshot-transport-test-plugin snapshot-transport-hooked-test-plugin game-window-monitor-asan-test snapshot-transport-game-host-asan capture-cap0-asan-test v1-transport-asan-test --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir native/telemetry-plugin/build-asan -C Release --output-on-failure -R asan-contract --output-junit "$PWD/.local/ci/ctest-plugin-asan.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Separate native client AddressSanitizer controls
        run: |
          $clientVsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $clientVsPath) { throw 'MSVC installation not found for client ASan runtime.' }
          $clientVcVersion = (Get-Content -LiteralPath (Join-Path $clientVsPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          $clientAsanBin = Join-Path $clientVsPath "VC\Tools\MSVC\$clientVcVersion\bin\Hostx64\x64"
          if (-not (Test-Path -LiteralPath (Join-Path $clientAsanBin 'clang_rt.asan_dynamic-x86_64.dll'))) { throw 'MSVC AddressSanitizer runtime not found.' }
          $env:PATH = "$clientAsanBin;$env:PATH"
          Write-Output "Client ASan runtime: $clientAsanBin"
          cmake -S native/telemetry-client -B native/telemetry-client/build-asan -G 'Visual Studio 17 2022' -A x64 -DETS2TELEMETRY_CLIENT_ASAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/telemetry-client/build-asan --config Release --target telemetry-pipe-client-asan telemetry-client-test-asan --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir native/telemetry-client/build-asan -C Release --output-on-failure --no-tests=error -R '^native-pipe-client-asan-' --output-junit "$PWD/.local/ci/ctest-client-asan.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record final versions and duration
        if: always()
        run: node scripts/ci/versions.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-asan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/ci
            native/telemetry-plugin/build-asan/Testing/Temporary
            native/telemetry-client/build-asan/Testing/Temporary
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
  windows-tests:
    name: Windows x64 tests
    # Runs in parallel with the scaffold and AddressSanitizer jobs on its own runner; same draft skip, triggers and
    # concurrency group. It needs no native build: the Node-safe suite runs before any build, and the storage suite bundles
    # its own worker (docs/ci.md#job-layout).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      npm_config_cache: ${{ github.workspace }}\.local\cache\npm
      electron_config_cache: ${{ github.workspace }}\.local\cache\electron
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ETS2TELEMETRY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Verify pinned npm and record host versions
        run: |
          if ((npm --version) -ne '11.17.0') { throw 'Expected npm 11.17.0 bundled with pinned Node.' }
          node scripts/ci/versions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cache/npm
            .local/cache/electron
          key: download-${{ runner.os }}-x64-node24.19.0-abi137-electron44.7.0-abi149-${{ hashFiles('package-lock.json', 'tools/lint/package-lock.json') }}
      - name: Clean lockfile installation
        run: npm ci
      # Its toolchain has a separate lockfile (docs/setup.md).
      - name: Lint TypeScript and JavaScript
        run: |
          npm run lint:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Runs under Windows PowerShell 5.1, like local checks; downloads the hash-pinned module.
      - name: Analyze PowerShell scripts
        run: npm run lint:ps
      - name: Full Node-safe suite and typecheck
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test -- --reporter=default --reporter=junit --outputFile=.local/ci/vitest.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Loads native better-sqlite3 only under the pinned Electron executable in Node mode, never plain Node (docs/storage.md).
      - name: Storage suite under the pinned Electron runtime
        timeout-minutes: 5
        run: |
          npm run test:storage -- --reporter=default --reporter=junit --outputFile=.local/ci/vitest-storage.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record final versions and duration
        if: always()
        run: node scripts/ci/versions.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-tests-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

name: Windows extended campaigns
# ET-019 PR-10 (owner decision D1, sizes D4; docs/ci.md#et-019-extended-campaigns). A separate workflow with its own
# concurrency group, decided after review: in the Windows CI run of a main push the long job was cancelled by the next
# merge, and its result changed that run's conclusion. This workflow is not a required check and never runs on pull
# requests, so the PR run keeps its default sizes. Dispatching it is the opt-in: gh workflow run windows-extended.yml --ref <branch>
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
# A newer main push waits for the running campaigns instead of cancelling them. GitHub keeps at most one pending run per
# group, so pushes made while a run is in progress collapse into the latest one.
concurrency:
  group: windows-extended-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-extended:
    name: Windows x64 extended campaigns
    runs-on: windows-2022
    # Bounds the sum: the seven step budgets below (3 + 3 + 9 + 9 + 18 + 19 + 8 + 2 = 71 min) plus 12 min
    # for checkout, setup, npm ci, the native configure and build of three test targets, and the upload.
    timeout-minutes: 83
    defaults:
      run:
        shell: pwsh
    env:
      npm_config_cache: ${{ github.workspace }}\.local\cache\npm
      electron_config_cache: ${{ github.workspace }}\.local\cache\electron
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      ETS2TELEMETRY_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      # Campaign sizes (D4). The PR run keeps the defaults: 4 seeds, 2,000 inputs per case and x1.
      ETS2TELEMETRY_RECOVERY_SEEDS: '200'
      ETS2TELEMETRY_FUZZ_ITERATIONS: '200000'
      ETS2TELEMETRY_NATIVE_FUZZ_MULTIPLIER: '50'
    # Step budgets: the local wall time on the implementer's machine x 3.0 x 1.5, rounded up to whole minutes, at least
    # 3 minutes. 3.0 covers the measured hosted slowdowns: protocol-fuzz.test.ts took 16.46 s in the tests job of hosted
    # main run 39214744965 against 7.42 s locally (2.2x), and the slow hosted run 39174985694 slowed single storage files
    # 2.8-3.0x against a green hosted run (docs/validation/et-019.md, PR-10 step budgets). 1.5 is headroom. Each campaign
    # step runs when its setup succeeded, even after an earlier campaign failed, so one failure does not hide the others.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.19.0'
          architecture: x64
          package-manager-cache: false
      - name: Acquire checksum-pinned CMake 4.3.1 x64
        run: ./scripts/ci/Install-CMake.ps1
      - name: Verify pinned npm and record host versions
        run: |
          if ((npm --version) -ne '11.17.0') { throw 'Expected npm 11.17.0 bundled with pinned Node.' }
          node scripts/ci/versions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -format json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/cache/npm
            .local/cache/electron
          key: download-${{ runner.os }}-x64-node24.19.0-abi137-electron44.7.0-abi149-${{ hashFiles('package-lock.json', 'tools/lint/package-lock.json') }}
      - name: Clean lockfile installation
        id: install
        run: npm ci
      # The seeds are fixed: the recovery campaign runs seeds 1 to ETS2TELEMETRY_RECOVERY_SEEDS, the protocol fuzz its
      # default seed 20261019 (ETS2TELEMETRY_FUZZ_SEED unset), and the native cases their seeds in source. A failure
      # reproduces locally with the same environment variables (docs/ci.md#et-019-extended-campaigns).
      - name: Record campaign parameters
        run: |
          New-Item -ItemType Directory -Force -Path .local/ci | Out-Null
          [ordered]@{
            sourceCommit = $env:ETS2TELEMETRY_SOURCE_COMMIT
            recoverySeeds = "1 to $env:ETS2TELEMETRY_RECOVERY_SEEDS"
            fuzzIterationsPerCase = $env:ETS2TELEMETRY_FUZZ_ITERATIONS
            fuzzSeed = 'default 20261019 (ETS2TELEMETRY_FUZZ_SEED unset)'
            nativeFuzzMultiplier = $env:ETS2TELEMETRY_NATIVE_FUZZ_MULTIPLIER
            nativeFuzzSeeds = 'fixed in native/telemetry-plugin/tests'
          } | ConvertTo-Json | Set-Content -LiteralPath .local/ci/extended-campaigns.json -Encoding utf8
          Get-Content -LiteralPath .local/ci/extended-campaigns.json
      # Only the three test executables of the seeded native fuzz cases, from the same Release tree as the scaffold job.
      - name: Build the native seeded fuzz cases
        id: native
        run: |
          # ET-055 PR-4: CMake's default channel is staging; the native fuzz cases keep running on the production names.
          cmake -S native/telemetry-plugin -B native/telemetry-plugin/build -G 'Visual Studio 17 2022' -A x64 -DETS2TELEMETRY_CHANNEL=production
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native/telemetry-plugin/build --config Release --target v1-producer-test snapshot-transport-test v1-transport-test --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The executables run directly: their CTest TIMEOUT properties (30-60 s) bound the x1 PR run, and the step budget
      # bounds the x50 run instead. Each prints its multiplier and planned iteration counts before its first iteration.
      # Local 27.0 s x 4.5 = 122 s, so the 3-minute floor.
      - name: Native v1 producer fuzz, x50
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & native/telemetry-plugin/build/Release/v1-producer-test.exe fuzz "$PWD/tests/fixtures/protocol-v1" 2>&1 | Tee-Object -FilePath .local/ci/native-fuzz-v1-producer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Local 4.8 s x 4.5 = 22 s, so the 3-minute floor.
      - name: Native v0 snapshot transport fuzz, x50
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          & native/telemetry-plugin/build/Release/snapshot-transport-test.exe fuzz 2>&1 | Tee-Object -FilePath .local/ci/native-fuzz-snapshot-transport.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Local 119.9 s x 4.5 = 540 s, so 9 minutes. Mostly waits on real pipes: a mutated hello that stays open is
      # observed for 1.5 s.
      - name: Native v1 transport fuzz, x50
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        timeout-minutes: 9
        run: |
          & native/telemetry-plugin/build/Release/v1-transport-test.exe fuzz 2>&1 | Tee-Object -FilePath .local/ci/native-fuzz-v1-transport.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Loads native better-sqlite3 only under the pinned Electron executable, like the storage step of the tests job.
      # Local 108 s x 4.5 = 486 s, so 9 minutes. This file has run 2.1 and 3.4 times slower hosted than locally.
      - name: Recovery campaign, 200 seeds
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 9
        run: |
          npm run test:storage -- tests/storage/trip-recorder-crash.test.ts --reporter=default --reporter=junit --outputFile=.local/ci/vitest-recovery-extended.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The protocol fuzz file runs in three steps, split by case name with -t, so that each step stays far below 30 minutes
      # hosted. The step "Check the protocol fuzz partition" fails unless the three patterns ran every case exactly once.
      # Vitest starts through node, as npm test would, but without npm's cmd.exe shell, which would see the | of a pattern.
      # Every input also runs under the test's own 10 s hang guard.
      # The seed check and the four payload decoders. Local 234 s x 4.5 = 1,053 s, so 18 minutes.
      - name: Protocol fuzz campaign, payload decoders, 200,000 inputs per case
        id: fuzz-payloads
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 18
        run: |
          node node_modules/vitest/vitest.mjs run tests/unit/protocol-fuzz.test.ts -t 'starts every campaign|rejects only with its protocol error' --reporter=default --reporter=junit --outputFile=.local/ci/vitest-fuzz-payloads.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The four frame decoders. Local 242 s x 4.5 = 1,089 s, so 19 minutes.
      - name: Protocol fuzz campaign, frame decoders, 200,000 inputs per case
        id: fuzz-frames
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 19
        run: |
          node node_modules/vitest/vitest.mjs run tests/unit/protocol-fuzz.test.ts -t 'follows the documented framing' --reporter=default --reporter=junit --outputFile=.local/ci/vitest-fuzz-frames.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The three broker stdout readers. Local 96 s x 4.5 = 432 s, so 8 minutes.
      - name: Protocol fuzz campaign, broker readers, 200,000 inputs per case
        id: fuzz-brokers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          node node_modules/vitest/vitest.mjs run tests/unit/protocol-fuzz.test.ts -t 'grants authority and relays frames' --reporter=default --reporter=junit --outputFile=.local/ci/vitest-fuzz-brokers.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Vitest passes a -t pattern that matches nothing, so a renamed or added case would silently leave the campaign.
      # Each JUnit file lists every case of the file, the unselected ones as skipped.
      - name: Check the protocol fuzz partition
        if: ${{ !cancelled() && steps.fuzz-payloads.outcome == 'success' && steps.fuzz-frames.outcome == 'success' && steps.fuzz-brokers.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          $runs = @{}
          foreach ($file in 'vitest-fuzz-payloads.xml', 'vitest-fuzz-frames.xml', 'vitest-fuzz-brokers.xml') {
            foreach ($case in ([xml](Get-Content -Raw -LiteralPath ".local/ci/$file")).SelectNodes('//testcase')) {
              if (-not $runs.ContainsKey($case.name)) { $runs[$case.name] = 0 }
              if (-not $case.SelectSingleNode('skipped')) { $runs[$case.name] += 1 }
            }
          }
          $wrong = @($runs.GetEnumerator() | Where-Object { $_.Value -ne 1 })
          foreach ($entry in $wrong) { Write-Output "$($entry.Value) runs: $($entry.Key)" }
          if ($runs.Count -eq 0 -or $wrong.Count -gt 0) { throw 'The -t patterns of the protocol fuzz steps must run every case exactly once.' }
          Write-Output "$($runs.Count) protocol fuzz cases, each run once."
      - name: Record final versions and duration
        if: always()
        run: node scripts/ci/versions.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-extended-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

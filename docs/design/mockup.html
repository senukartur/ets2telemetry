<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yukon Union Telemetry UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a presentation page holding a scaled 1280x800 Electron window (or a 1920x1080 game scene for the overlay).
   Colours mirror docs/design/tokens.css, which is the source of truth; this page inlines a copy because it must run
   standalone. Every implementable region carries data-spec="<id>" matching docs/design/ui-spec.md. */
:root {
  color-scheme: dark;
  --yu-bg-app: #111827; --yu-bg-chrome: #0B1120; --yu-bg-card: #1F2937; --yu-bg-inset: #1A2332; --yu-bg-input: #111827;
  --yu-border: #374151; --yu-border-input: #4B5563; --yu-divider: #2B3544; --yu-divider-chrome: #1F2937;
  --yu-text: #F3F4F6; --yu-text-secondary: #D1D5DB; --yu-text-muted: #9CA3AF;
  --yu-accent: #2563EB; --yu-accent-fg: #FFFFFF; --yu-accent-light: #60A5FA;
  --yu-selected-bg: rgba(37,99,235,.16); --yu-selected-border: rgba(96,165,250,.45); --yu-selected-fg: #DBEAFE;
  --yu-ok-fg: #8FD3AE; --yu-ok-bg: #13261D; --yu-ok-border: #2A5640;
  --yu-warn-fg: #E8C58A; --yu-warn-bg: #2A2213; --yu-warn-border: #5A4421;
  --yu-err-fg: #F3B4A4; --yu-err-bg: #2A1616; --yu-err-border: #5B2A27;
  --yu-neutral-fg: #D1D5DB; --yu-neutral-bg: #182131; --yu-neutral-border: #4B5563;
  --yu-online: #34D399; --yu-progress-pending: #E3A13F;
  --yu-ets2-fg: #7DD3FC; --yu-ets2-bg: rgba(14,165,233,.12); --yu-ets2-border: rgba(56,189,248,.4);
  --yu-ats-fg: #C4B5FD; --yu-ats-bg: rgba(139,92,246,.12); --yu-ats-border: rgba(167,139,250,.4);
  --yu-tile-gradient: linear-gradient(135deg, rgba(37,99,235,.32), rgba(31,41,55,.95) 70%); --yu-tile-border: rgba(96,165,250,.5);
  --yu-tile-teal-gradient: linear-gradient(135deg, rgba(20,184,166,.28), rgba(31,41,55,.95) 70%); --yu-tile-teal-border: rgba(45,212,191,.45);
  --yu-ov-panel: rgba(11,17,32,.80); --yu-ov-border: rgba(55,65,81,.9); --yu-ov-text: #F3F4F6; --yu-ov-muted: rgba(209,213,219,.72);
  --yu-ov-icon: rgba(156,163,175,.9); --yu-ov-accent: #60A5FA; --yu-ov-fuel: #8FD3AE; --yu-ov-low: #E8C58A; --yu-ov-bad: #F3B4A4; --yu-ov-edit: #60A5FA;
  --font: 'Onest', 'Segoe UI', system-ui, sans-serif;
  --page: #080D19;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--yu-text); }
body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 24px 56px; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--yu-accent-light); outline-offset: 2px; }

/* ---------- Presentation page ---------- */
.page { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.phead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; }
.phead .brandline { display: flex; align-items: center; gap: 12px; }
.phead img { width: 44px; height: 44px; }
.phead h1 { margin: 0; font-size: 24px; font-weight: 700; }
.phead p { margin: 2px 0 0; color: var(--yu-text-muted); font-size: 13px; max-width: 70ch; }
.ctrls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 14px; background: var(--yu-bg-chrome); border: 1px solid var(--yu-divider-chrome); border-radius: 12px; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl > span { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--yu-text-muted); }
.pseg { display: inline-flex; flex-wrap: wrap; background: var(--yu-bg-input); border: 1px solid var(--yu-border); border-radius: 10px; padding: 3px; gap: 2px; }
.pseg button { border: 0; background: transparent; color: var(--yu-text-secondary); min-height: 30px; padding: 0 11px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; }
.pseg button[aria-pressed="true"] { background: var(--yu-accent); color: #fff; }
.stage { position: relative; width: 100%; }
.stage > .scaled { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.notes { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
.note { background: var(--yu-bg-card); border: 1px solid var(--yu-border); border-radius: 12px; padding: 14px 18px; min-width: 0; }
.note h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; border-left: 3px solid var(--yu-accent); padding-left: 10px; }
.note p, .note li { margin: 0; font-size: 13px; color: var(--yu-text-secondary); }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.note code { font-size: 12px; color: var(--yu-selected-fg); background: var(--yu-bg-inset); padding: 1px 5px; border-radius: 4px; }
@media (max-width: 860px) { .notes { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Window ---------- */
.win { width: 1280px; height: 800px; background: var(--yu-bg-app); border: 1px solid #1F2937; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; font-size: 13px; color: var(--yu-text); box-shadow: 0 40px 90px -30px rgba(0,0,0,.8); position: relative; }
.titlebar { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; background: var(--yu-bg-chrome); padding-left: 10px; font-size: 12px; color: var(--yu-text-muted); border-bottom: 1px solid var(--yu-divider-chrome); }
.titlebar img { width: 16px; height: 16px; }
.titlebar .cap { margin-left: auto; display: flex; }
.titlebar .cap span { width: 46px; height: 32px; display: grid; place-items: center; color: var(--yu-text-secondary); }
.wbody { flex: 1; min-height: 0; display: flex; }
.side { width: 220px; flex: none; background: var(--yu-bg-chrome); border-right: 1px solid var(--yu-divider-chrome); display: flex; flex-direction: column; gap: 16px; padding: 14px 10px 12px; }
.lockup { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.lockup img { width: 36px; height: 36px; flex: none; }
.lockup b { display: block; font-size: 15px; font-weight: 700; line-height: 1.2; }
.lockup span { display: block; font-size: 11px; color: var(--yu-text-muted); }
.navg { display: flex; flex-direction: column; gap: 2px; }
.navg > .gl { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--yu-text-muted); padding: 0 10px 6px; display: flex; align-items: center; gap: 6px; }
.nav { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--yu-text-secondary); font-size: 13.5px; cursor: pointer; text-align: left; width: 100%; }
.nav:hover { background: rgba(255,255,255,.03); }
.nav[aria-current="page"] { background: var(--yu-selected-bg); border-color: var(--yu-selected-border); color: var(--yu-selected-fg); font-weight: 600; }
.nav .grow { flex: 1; }
.sfoot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.recbox { background: var(--yu-bg-app); border: 1px solid var(--yu-divider-chrome); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.recbox .l1 { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.recbox .l2 { font-size: 12px; color: var(--yu-text-muted); }
.sfoot .row2 { display: flex; gap: 8px; border-top: 1px solid var(--yu-divider-chrome); padding-top: 10px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: var(--yu-bg-chrome); border-bottom: 1px solid var(--yu-divider-chrome); }
.topbar h1 { margin: 0 12px 0 0; font-size: 18px; font-weight: 700; }
.content { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }

.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.s { width: 14px; height: 14px; } .ico.l { width: 18px; height: 18px; } .ico.xl { width: 28px; height: 28px; }

.card { background: var(--yu-bg-card); border: 1px solid var(--yu-border); border-radius: 12px; min-width: 0; }
.card.hero { background: var(--yu-tile-gradient); border-color: var(--yu-tile-border); }
.card.teal { background: var(--yu-tile-teal-gradient); border-color: var(--yu-tile-teal-border); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.ct { font-size: 15px; font-weight: 600; border-left: 3px solid var(--yu-accent); padding-left: 10px; line-height: 1.25; margin: 0; }
.cd { font-size: 12px; color: var(--yu-text-muted); }
.cb { padding: 12px 16px 16px; }
.grid { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--yu-text-muted); }
.t2 { color: var(--yu-text-secondary); }
.small { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.b6 { font-weight: 600; }
.b7 { font-weight: 700; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.label { font-size: 12px; color: var(--yu-text-muted); }
.metric { font-size: 28px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.metric small { font-size: 13px; font-weight: 600; color: var(--yu-text-muted); margin-left: 4px; letter-spacing: 0; }
.sep { height: 1px; background: var(--yu-divider); }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; border: 1px solid; white-space: nowrap; }
.ok { color: var(--yu-ok-fg); background: var(--yu-ok-bg); border-color: var(--yu-ok-border); }
.warn { color: var(--yu-warn-fg); background: var(--yu-warn-bg); border-color: var(--yu-warn-border); }
.err { color: var(--yu-err-fg); background: var(--yu-err-bg); border-color: var(--yu-err-border); }
.neutral { color: var(--yu-neutral-fg); background: var(--yu-neutral-bg); border-color: var(--yu-neutral-border); }
.g-ets2 { color: var(--yu-ets2-fg); background: var(--yu-ets2-bg); border-color: var(--yu-ets2-border); }
.g-ats { color: var(--yu-ats-fg); background: var(--yu-ats-bg); border-color: var(--yu-ats-border); }
.later { color: #93C5FD; background: transparent; border: 1px dashed var(--yu-accent-light); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.dot.live { background: var(--yu-online); box-shadow: 0 0 0 3px rgba(52,211,153,.18); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid transparent; }
.btn.p { background: var(--yu-accent); color: #fff; }
.btn.s { background: transparent; border-color: var(--yu-border-input); color: var(--yu-text); }
.btn.d { background: transparent; border-color: var(--yu-err-fg); color: var(--yu-err-fg); }
.btn.g { background: transparent; color: var(--yu-text-secondary); }
.btn.sm { min-height: 30px; padding: 0 11px; font-size: 12.5px; }
.btn.icon { width: 34px; padding: 0; }
.input { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 11px; border-radius: 10px; background: var(--yu-bg-input); border: 1px solid var(--yu-border-input); color: var(--yu-text-muted); font-size: 13px; }
.input.val { color: var(--yu-text); justify-content: space-between; }
.seg { display: inline-flex; background: var(--yu-bg-input); border: 1px solid var(--yu-border); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--yu-text-secondary); min-height: 28px; padding: 0 11px; border-radius: 7px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--yu-accent); color: #fff; }
.bar { height: 8px; border-radius: 99px; background: var(--yu-border); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--yu-accent-light); }
.bar.amber > i { background: var(--yu-progress-pending); }
.bar.ok > i { background: var(--yu-ok-fg); }
.switch { width: 36px; height: 20px; border-radius: 99px; background: var(--yu-border); position: relative; flex: none; border: 0; cursor: pointer; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--yu-text-secondary); transition: left .15s; }
.switch.on { background: var(--yu-accent); }
.switch.on::after { left: 19px; background: #fff; }
.slider { position: relative; height: 20px; display: flex; align-items: center; width: 160px; }
.slider::before { content: ""; position: absolute; left: 0; right: 0; height: 6px; border-radius: 99px; background: var(--yu-border); }
.slider > i { position: absolute; left: 0; height: 6px; border-radius: 99px; background: var(--yu-accent-light); }
.slider > b { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--yu-accent); transform: translateX(-50%); }
.check { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--yu-border-input); display: grid; place-items: center; flex: none; }
.check.on { background: var(--yu-accent); border-color: var(--yu-accent); color: #fff; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--yu-border-input); display: grid; place-items: center; flex: none; }
.radio.on { border-color: var(--yu-accent-light); }
.radio.on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--yu-accent-light); }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; background: var(--yu-bg-inset); color: var(--yu-text-muted); font-size: 12px; font-weight: 500; height: 34px; padding: 0 10px; white-space: nowrap; }
table.t td { padding: 9px 10px; border-top: 1px solid var(--yu-divider); vertical-align: middle; }
table.t .r { text-align: right; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: rgba(255,255,255,.025); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid var(--yu-divider); }
.kv:first-child { border-top: 0; }
.kv > span:first-child { color: var(--yu-text-muted); }
.kv .note { display: block; font-size: 11px; color: var(--yu-text-muted); opacity: .8; }
.kv b { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.win[data-conn="lost"] .val, .ovl[data-conn="lost"] .val { opacity: .45; }
.win[data-conn="waiting"] .val { color: var(--yu-text-muted); }

/* Live */
.gear { min-width: 64px; height: 64px; padding: 0 10px; border-radius: 12px; border: 1px solid var(--yu-tile-border); background: rgba(11,17,32,.5); display: grid; place-items: center; font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tank { width: 46px; height: 168px; border-radius: 10px; background: var(--yu-bg-inset); border: 1px solid var(--yu-border); position: relative; overflow: hidden; flex: none; }
.tank > i { position: absolute; left: 0; right: 0; bottom: 0; }
.tank > s { position: absolute; left: 0; right: 0; height: 1px; background: rgba(0,0,0,.35); }
.route { position: relative; height: 40px; }
.route .ln { position: absolute; left: 10px; right: 10px; top: 18px; height: 8px; border-radius: 99px; background: var(--yu-border); }
.route .dn { position: absolute; left: 10px; top: 18px; height: 8px; border-radius: 99px; background: var(--yu-accent-light); }
.route .pt { position: absolute; top: 13px; width: 18px; height: 18px; border-radius: 50%; border: 4px solid var(--yu-bg-card); }
.route .tk { position: absolute; top: 6px; width: 32px; height: 32px; border-radius: 50%; background: var(--yu-accent); color: #fff; display: grid; place-items: center; transform: translateX(-50%); box-shadow: 0 0 0 4px var(--yu-bg-card); }
.hmgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.hmi { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--yu-text-secondary); min-height: 24px; }
.hmi.bad { color: var(--yu-err-fg); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 28px 20px; color: var(--yu-text-secondary); }
.empty .ei { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; border: 1px solid var(--yu-border); background: var(--yu-bg-inset); color: var(--yu-accent-light); }
.empty h3 { margin: 4px 0 0; font-size: 16px; font-weight: 700; color: var(--yu-text); }
.empty p { margin: 0; max-width: 46ch; font-size: 13px; color: var(--yu-text-muted); }

/* Sheet */
.scrim { position: absolute; inset: 0; background: rgba(3,6,14,.55); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: 470px; background: var(--yu-bg-card); border-left: 1px solid var(--yu-border); box-shadow: -20px 0 50px rgba(0,0,0,.45); display: flex; flex-direction: column; }
.sheet .sh { padding: 16px 18px 12px; border-bottom: 1px solid var(--yu-divider); display: flex; flex-direction: column; gap: 10px; }
.sheet .sb { flex: 1; overflow: auto; padding: 4px 18px 12px; }
.sheet .sf { padding: 12px 18px; border-top: 1px solid var(--yu-divider); font-size: 12px; color: var(--yu-text-muted); }
.crit { display: grid; grid-template-columns: 26px minmax(0, 1fr) 70px 70px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--yu-divider); }
.crit:first-child { border-top: 0; }
.crit .cv { font-size: 11px; color: var(--yu-text-muted); }
.crit .req, .crit .det { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }
.crit.bad .det { color: var(--yu-err-fg); font-weight: 700; }
.sicon { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; border: 1px solid; }

/* Journal + trip */
.tl { display: grid; grid-template-columns: 50px 16px minmax(0,1fr) auto; gap: 8px; align-items: start; padding: 7px 0; }
.tl .rl { position: relative; height: 100%; display: flex; justify-content: center; }
.tl .rl::before { content: ""; position: absolute; top: 14px; bottom: -14px; width: 1px; background: var(--yu-divider); }
.tl:last-child .rl::before { display: none; }
.tl .rl i { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; position: relative; }
.ivbar { display: flex; height: 14px; border-radius: 6px; overflow: hidden; gap: 2px; }
.ivbar i { display: block; height: 100%; }

/* Settings */
.snav { width: 200px; flex: none; display: flex; flex-direction: column; gap: 2px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 12px 0; border-top: 1px solid var(--yu-divider); }
.srow:first-child { border-top: 0; }
.srow b { display: block; font-weight: 600; font-size: 13.5px; }
.srow .d { font-size: 12px; color: var(--yu-text-muted); }
.lopt { border: 1px solid var(--yu-border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; background: var(--yu-bg-inset); cursor: pointer; text-align: left; }
.lopt.on { border-color: var(--yu-selected-border); background: var(--yu-selected-bg); color: var(--yu-selected-fg); }
.lopt .th { height: 56px; border-radius: 6px; background: linear-gradient(180deg, #33415c, #2a3324); position: relative; }
.lopt .th i { position: absolute; background: rgba(11,17,32,.85); border: 1px solid rgba(96,165,250,.5); border-radius: 3px; }
.secrow { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 0 2px; border: 0; border-top: 1px solid var(--yu-divider); background: transparent; color: var(--yu-text); font-size: 13px; cursor: pointer; text-align: left; }
.secrow:first-of-type { border-top: 0; }
.secrow .req { font-size: 11px; color: var(--yu-text-muted); margin-left: 6px; }

/* Wizard */
.wiz { flex: 1; display: grid; grid-template-columns: 300px minmax(0,1fr); min-height: 0; }
.wsteps { background: var(--yu-bg-chrome); border-right: 1px solid var(--yu-divider-chrome); padding: 28px 22px; display: flex; flex-direction: column; gap: 6px; }
.wstep { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid transparent; color: var(--yu-text-muted); }
.wstep .n { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--yu-border-input); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
.wstep.on { background: var(--yu-selected-bg); border-color: var(--yu-selected-border); color: var(--yu-selected-fg); }
.wstep.on .n { background: var(--yu-accent); border-color: var(--yu-accent); color: #fff; }
.wstep.done { color: var(--yu-text-secondary); }

    if (on('game-time') || on('hard-mode')) parts.push('<div style="display:flex;justify-content:space-between;align-items:center;font-size:12.5px">' + (on('game-time') ? v(t('fmt.day', { d: d.day, t: d.clock })) : '<span></span>') + (on('hard-mode') ? hmIcon : '') + '</div>');
    html = open('overlay.card', 'right:28px;top:28px;width:310px') + handle('top:-36px;left:0') + '<div class="panel" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="lbl">' + d.game + ' · ' + t('mode.' + d.mode) + '</span>' + tag + '</div>' +
      parts.join('<div style="height:1px;background:rgba(255,255,255,.12)"></div>') + '</div></div>';
  } else if (S.ovl === 'cluster') {
    var cx = 110, cy = 110, a0 = -130, a1 = 130, f = d.speed / d.spMax, rf = d.rpm / d.rpmMax;
    var g = (on('speed') || on('gear') || on('rpm')) ? '<svg viewBox="0 0 220 220" width="220" height="220" style="flex:none"><circle cx="110" cy="110" r="104" fill="rgba(11,17,32,.80)" stroke="rgba(55,65,81,.9)"/>' +
      (on('speed') ? '<path d="' + arc(cx, cy, 92, a0, a1) + '" stroke="rgba(255,255,255,.14)" stroke-width="8" fill="none" stroke-linecap="round"/><path class="val" d="' + arc(cx, cy, 92, a0, a0 + (a1 - a0) * f) + '" stroke="#60A5FA" stroke-width="8" fill="none" stroke-linecap="round"/>' +
        '<text class="val" x="110" y="112" text-anchor="middle" font-size="50" font-weight="800" fill="#F3F4F6" font-family="Onest, sans-serif">' + d.speed.toFixed(0) + '</text><text x="110" y="134" text-anchor="middle" font-size="11" fill="rgba(209,213,219,.72)" font-family="Onest, sans-serif">' + u(d.spU) + '</text>' : '') +
      (on('rpm') ? '<path d="' + arc(cx, cy, 78, a0, a1) + '" stroke="rgba(255,255,255,.08)" stroke-width="4" fill="none"/><path class="val" d="' + arc(cx, cy, 78, a0, a0 + (a1 - a0) * rf) + '" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/><text class="val" x="110" y="192" text-anchor="middle" font-size="10.5" fill="rgba(209,213,219,.72)" font-family="Onest, sans-serif">' + d.rpm + ' ' + u('rpm') + '</text>' : '') +
      (on('gear') ? '<text class="val" x="110" y="' + (on('speed') ? 172 : 124) + '" text-anchor="middle" font-size="' + (on('speed') ? 20 : 44) + '" font-weight="800" fill="#60A5FA" font-family="Onest, sans-serif">' + d.gear + '</text>' : '') + '</svg>' : '';
    var txt = { fuel: fp + '% · ' + d.fuel + ' ' + u(d.volU), range: d.range + ' ' + u(d.dU), 'sdk-consumption': d.avg + ' ' + u(d.avgU), cargo: d.cargo + ' · ' + d.mass + ' ' + u(d.massU), origin: d.from, destination: d.to, 'distance-driven': d.done + ' ' + u(d.dU), 'distance-remaining': d.remaining + ' ' + u(d.dU), deadline: t('fmt.in', { h: d.dl[0], m: d.dl[1] }), 'expected-income': d.income, 'game-time': t('fmt.day', { d: d.day, t: d.clock }) };
    var rows = ['fuel', 'range', 'sdk-consumption', 'cargo', 'origin', 'destination', 'distance-driven', 'distance-remaining', 'deadline', 'expected-income', 'game-time'].filter(on).map(function (k) {
      return '<div><div class="lbl">' + t('sec.' + k) + '</div><div class="val" style="font-weight:700;font-size:13.5px">' + txt[k] + '</div>' + (k === 'fuel' ? '<div class="obar fuel ' + (fp < 30 ? 'low' : '') + '" style="margin-top:5px"><i class="val" style="width:' + fp + '%"></i></div>' : '') + '</div>';
    }).join('') + (on('hard-mode') ? hmIcon : '');
    html = open('overlay.cluster', 'left:28px;bottom:24px') + handle('top:-36px;left:0') + '<div style="display:flex;align-items:end;gap:10px">' + g + (rows || tag ? '<div class="panel" style="padding:10px 12px;width:230px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px">' + tag + rows + '</div>' : '') + '</div></div>';
  } else {
    var line = function (keys) { return keys.filter(on).map(function (k) { return k === 'speed' ? '<span><span class="val" style="font-size:30px;font-weight:800">' + d.speed.toFixed(0) + '</span> ' + u(d.spU) + '</span>' : k === 'hard-mode' ? hmIcon : '<span><span style="opacity:.7">' + t('sec.' + k).toLowerCase() + '</span> <b class="val">' + ({ gear: d.gear, rpm: d.rpm + ' ' + u('rpm'), fuel: fp + '%', range: d.range + ' ' + u(d.dU), 'sdk-consumption': d.avg + ' ' + u(d.avgU), cargo: d.cargo, origin: d.from, destination: d.to, 'distance-driven': d.done + ' ' + u(d.dU), 'distance-remaining': d.remaining + ' ' + u(d.dU), deadline: d.dl[0] + ':' + d.dl[1], 'expected-income': d.income, 'game-time': t('fmt.day', { d: d.day, t: d.clock }) })[k] + '</b></span>'; }).join(' · '); };
    var l1 = line(['speed', 'gear', 'rpm']), rest = [line(['fuel', 'range', 'sdk-consumption']), line(['cargo', 'origin', 'destination']), line(['distance-driven', 'distance-remaining', 'deadline', 'expected-income']), line(['game-time', 'hard-mode'])].filter(Boolean);
    html = open('overlay.hud', 'left:30px;top:28px;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)') + handle('top:-36px;left:0') + '<div style="display:flex;align-items:baseline;gap:14px;font-size:15px">' + l1 + tag + '</div>' +
      rest.map(function (l) { return '<div style="font-size:14px;margin-top:2px;opacity:.94">' + l + '</div>'; }).join('') + '</div>';
  }
  var bar = edit ? '<div class="editbar" style="' + (S.ovl === 'strip' ? 'bottom:22px' : 'top:18px') + '">' + ic('move', 's') + '<span>' + t('ov.edit') + '</span><button class="btn s sm">' + t('c.reset') + '</button><button class="btn p sm" data-ovedit="0">' + t('c.done') + '</button></div>' : '';
  return sceneBg() + html + bar;
}

/* ---------- Notes per screen (English, for agents) ---------- */
var NOTES = {
  live: ['Live (ui-spec §5.1)', ['Variant B instrument layout in Yukon style: hero gradient tile with the speed gauge (ring = speed, inner arc = RPM), gear block and fuel tank.', 'Hard Mode card (ET-026c) opens the checklist sheet. Try the Hard Mode control above: 12/12, 10/12 and lost mid-trip.', 'Waiting shows the empty-state banner and dashes; Lost greys values and shows a stale badge; Paused keeps values with a paused badge.'],
    ['shell.topbar.status', 'live.instrument', 'live.hardMode', 'hardMode.sheet', 'live.job', 'live.trip']],
  journal: ['Journal (ui-spec §5.3)', ['Table per the Yukon guide: header #1A2332, dividers #2B3544, numbers right-aligned, no zebra.', 'Columns map to JournalTripSummary: outcome open/delivered/cancelled/none, recording complete/partial/unknown. "Delivered late" is a display of a delivered outcome with lateness.', 'Sync column is server-phase (Later) and is hidden until sync exists. Click a row for trip details.'],
    ['journal.filters', 'journal.table', 'journal.pager']],
  trip: ['Trip details (ui-spec §5.4)', ['Planned, observed and game-reported distance stay separate; expected income and revenue/penalty stay separate; real and game time stay separate.', 'Tabs map to the existing Summary / Timeline / Completeness views of ET-016.', 'Hard Mode card shows the evaluation at job start and at delivery (ET-026b snapshot).'],
    ['trip.header', 'trip.tiles', 'trip.detailTabs', 'trip.hardMode', 'trip.money']],
  settings: ['Settings (ui-spec §5.5)', ['Left sub-navigation replaces the current single long dashboard column. Each panel is a card with the blue title bar.', 'Overlay sections reuse OVERLAY_SECTION_IDS, groups and presets from overlay-sections.ts; hard-mode is a proposed new section in a new Status group.', 'Start with Windows is shown as Planned: autostart is not authorized yet.'],
    ['settings.nav', 'settings.overlay', 'settings.sections']],
  account: ['Account & sync (ui-spec §5.6)', ['Server phase, not in the MVP. Drawn so the shell reserves its place and the dashboard team sees the flow.', 'Token is masked by default; uploading is not acceptance.', 'Switch Connection to Lost to see the offline queue state.'], ['account.token', 'account.status', 'account.firstSync']],
  onboarding: ['First run (ui-spec §5.7)', ['Four steps: find games, install plugin, language and units, overlay layout. Use Back/Next inside the window.', 'Plugin installation keeps the existing rules: only while the game is closed, hash-verified, never overwriting unknown files.'], ['onboarding.steps', 'onboarding.step']],
  states: ['Empty and error states (ui-spec §6)', ['Every state pairs an icon, a title and one sentence that says what to do. Status colour is never the only signal.', 'Token, offline and first-sync states belong to the server phase.'], ['states.*']],
  overlay: ['Overlay (ui-spec §7)', ['1920×1080 scene at 100% scaling. Strip is the default, top centre, clear of the in-game route advisor.', 'Overlay CSS uses only --yu-ov-* tokens and never loads the shadcn base stylesheet. No backdrop blur.', 'Section switches from Settings → Overlay sections apply here; the Hard Mode status is a proposed new section.'], ['overlay.strip', 'overlay.card', 'overlay.cluster', 'overlay.hud']]
};

/* ---------- Render ---------- */
function screenHtml() {
  var s = S.screen;
  if (s === 'onboarding') return onboardingScreen();
  if (s === 'overlay') return '<div class="scene ' + (S.inspect === 'on' ? 'inspect' : '') + '">' + overlayScene() + '</div>';
  var titles = { live: t('live.title'), journal: t('j.title'), trip: t('j.title'), settings: t('nav.settings'), account: t('nav.account'), states: t('st.title') };
  var extra = s === 'journal' ? '<button class="btn s sm">' + ic('refresh', 's') + t('j.refresh') + '</button>' : '';
  var body = s === 'live' ? liveScreen() : s === 'journal' ? journalScreen() : s === 'trip' ? tripScreen() : s === 'settings' ? settingsScreen() : s === 'account' ? accountScreen() : statesScreen();
  return windowShell(titles[s], extra, body, s === 'live' && S.sheet ? hmSheet() : '');
}
function pressed(id, attr, v) { var b = document.querySelectorAll('#' + id + ' button'); for (var i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', b[i].getAttribute(attr) === v ? 'true' : 'false'); }
function fit() {
  var stage = document.getElementById('stage'), host = document.getElementById('host');
  var w = S.screen === 'overlay' ? 1922 : 1282, h = S.screen === 'overlay' ? 1082 : 802;
  var sc = Math.min(1, stage.clientWidth / w);
  host.style.transform = 'scale(' + sc + ')'; stage.style.height = (h * sc) + 'px';
}
function render() {
  pressed('c-screen', 'data-screen', S.screen); pressed('c-lang', 'data-lang', S.lang); pressed('c-game', 'data-game', S.game); pressed('c-conn', 'data-conn', S.conn); pressed('c-hm', 'data-hm', S.hm); pressed('c-inspect', 'data-inspect', S.inspect);
  document.documentElement.lang = S.lang;
  document.getElementById('host').innerHTML = screenHtml();
  var n = NOTES[S.screen];
  document.getElementById('note-main').innerHTML = '<h2>' + n[0] + '</h2><ul>' + n[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
  document.getElementById('note-side').innerHTML = '<h2>Spec ids on this screen</h2><p>' + n[2].map(function (x) { return '<code>' + x + '</code>'; }).join(' ') + '</p>' +
    (S.screen === 'overlay' ? '<p style="margin-top:10px"><span class="pseg" id="c-ovl"><button data-ovl="strip">Strip</button><button data-ovl="card">Card</button><button data-ovl="cluster">Cluster</button><button data-ovl="hud">Minimal</button></span> <span class="pseg"><button data-ovedit="' + (S.ovEdit ? '0' : '1') + '" aria-pressed="' + S.ovEdit + '">Layout edit</button></span></p>' : '');
  if (S.screen === 'overlay') pressed('c-ovl', 'data-ovl', S.ovl);
  fit(); save();
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-screen],[data-lang],[data-game],[data-conn],[data-hm],[data-inspect],[data-go],[data-sheet],[data-trip],[data-triptab],[data-set],[data-sect],[data-preset],[data-ovl],[data-ovedit],[data-wiz],[data-lang-toggle]');
  if (!el) return;
  var a;
  if ((a = el.getAttribute('data-screen'))) { S.screen = a; S.sheet = false; }
  else if ((a = el.getAttribute('data-lang'))) S.lang = a;
  else if (el.getAttribute('data-lang-toggle')) S.lang = S.lang === 'en' ? 'ru' : 'en';
  else if ((a = el.getAttribute('data-game'))) S.game = a;
  else if ((a = el.getAttribute('data-conn'))) S.conn = a;
  else if ((a = el.getAttribute('data-hm'))) S.hm = a;
  else if ((a = el.getAttribute('data-inspect'))) S.inspect = a;
  else if ((a = el.getAttribute('data-go'))) { S.screen = a; S.sheet = false; }
  else if ((a = el.getAttribute('data-sheet'))) S.sheet = a === '1';
  else if ((a = el.getAttribute('data-trip'))) { S.trip = +a; S.screen = 'trip'; S.tripTab = 'summary'; }

  else if ((a = el.getAttribute('data-set'))) S.set = a;
  else if ((a = el.getAttribute('data-sect'))) S.on[a] = !on(a);
  else if ((a = el.getAttribute('data-preset'))) { S.on = {}; ALLSECS.forEach(function (k) { S.on[k] = PRESETS[a].indexOf(k) >= 0; }); }
  else if ((a = el.getAttribute('data-ovl'))) S.ovl = a;

  render();

window.addEventListener('resize', fit);
if (typeof module === 'undefined') render();

})();
